<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Loving Life Foundation</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

  <style>
    /* Design Tokens */
    :root{
      /* BRAND COLORS */
      --ll-navy:#1a2a49;--ll-navy-deep:#0f1a2f;--ll-black:#111111;--ll-ink:#1b1b1b;
      --ll-orange:#F26B1F;--ll-orange-warm:#E85D12;
      --ll-green:#5DD90A;--ll-green-grass:#3E8E41;--ll-sky:#2FA7E0;
      --ll-cream:#F7F2E8;--ll-paper:#FBF8F1;--ll-sand:#EFE7D4;
      --ll-stone-50:#F5F4F1;--ll-stone-100:#EBE8E1;--ll-stone-200:#D8D3C7;--ll-stone-300:#B8B1A1;--ll-stone-500:#7A7566;--ll-stone-700:#3E3A30;
      /* SEMANTIC */
      --bg:var(--ll-paper);--bg-alt:var(--ll-cream);--bg-inverse:var(--ll-navy);
      --surface:#ffffff;--surface-raised:#ffffff;
      --fg1:var(--ll-ink);--fg2:var(--ll-stone-700);--fg3:var(--ll-stone-500);--fg-on-dark:#ffffff;--fg-on-orange:#ffffff;
      --primary:var(--ll-navy);--primary-hover:var(--ll-navy-deep);
      --accent:var(--ll-orange);--accent-hover:var(--ll-orange-warm);
      --highlight:var(--ll-green);
      --border:var(--ll-stone-200);--border-strong:var(--ll-stone-300);--divider:var(--ll-stone-100);
      --success:var(--ll-green-grass);--info:var(--ll-sky);--warn:var(--ll-orange);--danger:#B4321E;
      /* TYPOGRAPHY */
      --font-display:"Playfair Display","Cormorant Garamond",Georgia,serif;
      --font-condensed:"Oswald","Barlow Condensed","Arial Narrow",sans-serif;
      --font-body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
      --text-xs:12px;--text-sm:14px;--text-base:16px;--text-md:18px;--text-lg:20px;--text-xl:24px;--text-2xl:30px;--text-3xl:40px;--text-4xl:54px;--text-5xl:72px;--text-hero:96px;
      --lh-tight:1.08;--lh-snug:1.2;--lh-normal:1.45;--lh-relaxed:1.65;
      --tracking-tight:-0.02em;--tracking-normal:0;--tracking-wide:0.08em;--tracking-wider:0.18em;
      /* SPACING */
      --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;--sp-7:48px;--sp-8:64px;--sp-9:96px;--sp-10:128px;
      /* EFFECTS */
      --radius-xs:2px;--radius-sm:4px;--radius-md:8px;--radius-lg:14px;--radius-xl:22px;--radius-pill:999px;
      --shadow-xs:0 1px 2px rgba(26,42,73,0.06);
      --shadow-sm:0 2px 6px rgba(26,42,73,0.08);
      --shadow-md:0 8px 20px rgba(26,42,73,0.10);
      --shadow-lg:0 18px 40px rgba(26,42,73,0.14);
      --shadow-photo:0 2px 4px rgba(0,0,0,0.08),0 18px 36px rgba(26,42,73,0.18);
      --ease-out:cubic-bezier(0.22,1,0.36,1);
      --ease-in:cubic-bezier(0.55,0,0.68,0.19);
      --ease-soft:cubic-bezier(0.4,0,0.2,1);
      --dur-fast:140ms;--dur-base:220ms;--dur-slow:420ms;
      /* LAYOUT */
      --container-sm:640px;--container-md:880px;--container-lg:1120px;--container-xl:1280px;
    }

    /* Base Elements */
    * { box-sizing: border-box; }
    html { color: var(--fg1); background: var(--bg); }
    body { margin: 0; padding: 0; font-family: var(--font-body); font-size: var(--text-base); line-height: var(--lh-normal); color: var(--fg1); background: var(--bg); -webkit-font-smoothing: antialiased; }
    h1, h2, h3, h4, h5, h6 { font-family: var(--font-body); color: var(--ll-navy); margin: 0 0 10px; font-weight: 700; }
    h1 { font-size: 48px; font-weight: 800; line-height: 1.05; }
    h2 { font-size: 32px; font-weight: 700; line-height: 1.15; }
    h3 { font-size: 22px; font-weight: 700; line-height: 1.25; }
    h4 { font-size: 18px; font-weight: 700; }
    h5 { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.18em; }
    p { line-height: 1.65; color: var(--fg2); margin: 0 0 14px; }
    .lead { font-size: 20px; line-height: 1.5; color: var(--ll-navy); font-weight: 500; }
    blockquote { margin: 22px 0; border-left: 3px solid var(--ll-orange); padding: 6px 0 6px 22px; font-weight: 500; font-size: 22px; line-height: 1.35; color: var(--ll-navy); }
    a { color: var(--ll-navy); text-decoration: none; }
    a:hover { color: var(--ll-orange); }

    /* App Layout */
    .app { min-height: 100vh; display: flex; flex-direction: column; }

    /* Header */
    .site-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 40px; background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
    .site-nav { display: flex; align-items: center; gap: 8px; }
    .site-nav__link { font-family: var(--font-body); font-weight: 500; font-size: 14px; color: var(--fg2); text-decoration: none; padding: 8px 12px; border-radius: 6px; transition: color 0.15s, background 0.15s; cursor: pointer; }
    .site-nav__link:hover { color: var(--ll-orange); }
    .site-nav__link.is-active { color: var(--ll-navy); background: var(--ll-stone-50); }

    /* Buttons */
    .btn { font-family: var(--font-body); font-weight: 600; font-size: 14px; padding: 10px 18px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; transition: background 0.18s, color 0.18s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn--primary { background: var(--ll-navy); color: #fff; }
    .btn--primary:hover { background: var(--ll-navy-deep); }
    .btn--accent { background: var(--ll-orange); color: #fff; }
    .btn--accent:hover { background: var(--ll-orange-warm); }
    .btn--ghost { background: transparent; color: var(--ll-navy); border-color: var(--border-strong); }
    .btn--ghost:hover { border-color: var(--ll-navy); background: var(--ll-stone-50); }
    .btn--donate { font-family: var(--font-condensed); font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; background: var(--ll-orange); color: #fff; font-size: 13px; padding: 11px 20px; }
    .btn--donate:hover { background: var(--ll-orange-warm); }
    .btn:active { transform: scale(0.97); }

    /* Utilities */
    .eyebrow { font-family: var(--font-condensed); font-weight: 500; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ll-orange); display: inline-block; margin-bottom: 10px; }
    .event-title { font-family: var(--font-condensed); font-weight: 700; font-size: 48px; line-height: 1.02; text-transform: uppercase; color: var(--ll-navy); letter-spacing: 0.01em; }
    .link-arrow { font-family: var(--font-condensed); text-transform: uppercase; letter-spacing: 0.16em; font-size: 12px; font-weight: 600; color: var(--ll-navy); }
    .link-arrow:hover { color: var(--ll-orange); }

    /* Main Content */
    main { flex: 1; max-width: var(--container-xl); margin: 0 auto; padding: 56px 40px; width: 100%; }
    .page { display: flex; flex-direction: column; gap: 72px; }

    /* Hero Section */
    .hero { display: grid; grid-template-columns: 1.3fr 1fr; gap: 48px; align-items: center; }
    .hero__title { font-size: 62px; line-height: 1.02; }
    .hero__lede { font-size: 19px; line-height: 1.55; color: var(--fg2); max-width: 52ch; margin-top: 16px; }
    .hero__ctas { display: flex; gap: 12px; margin-top: 28px; }
    .hero__mark img { width: 100%; max-width: 360px; margin: 0 auto; display: block; }

    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; background: var(--ll-cream); border-radius: 14px; padding: 32px; }
    .stat { text-align: center; }
    .stat__num { font-family: var(--font-body); font-weight: 800; font-size: 46px; color: var(--ll-orange); letter-spacing: -0.02em; line-height: 1; }
    .stat__label { font-family: var(--font-condensed); text-transform: uppercase; letter-spacing: 0.16em; font-size: 11px; color: var(--fg3); margin-top: 8px; }

    /* Sections */
    .section-head { margin-bottom: 28px; }
    .programs__grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .program-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; }
    .program-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .program-card__img { height: 200px; background-size: cover; background-position: center top; background-color: var(--ll-cream); }
    .program-card__body { padding: 20px 22px 22px; }
    .program-card__body h3 { margin: 4px 0 8px; }
    .program-card__body p { font-size: 14px; margin: 0 0 14px; }

    /* Pullquote */
    .pullquote { text-align: center; padding: 48px 20px; background: var(--ll-cream); border-radius: 14px; }
    .pullquote blockquote { font-size: 42px; border: 0; padding: 0; margin: 0; font-weight: 600; font-style: italic; color: var(--ll-navy); }
    .pullquote__attr { font-family: var(--font-condensed); text-transform: uppercase; letter-spacing: 0.2em; font-size: 12px; color: var(--fg3); margin-top: 18px; }

    /* Page Hero */
    .page-hero { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; background: var(--ll-cream); border-radius: 14px; padding: 40px; }
    .page-hero__art { width: 100%; border-radius: 10px; box-shadow: var(--shadow-photo); }

    /* Two Column */
    .two-col { display: grid; grid-template-columns: 1.6fr 1fr; gap: 40px; }
    .two-col h3 { margin-top: 24px; }
    .two-col h3:first-child { margin-top: 0; }

    /* Timeline Card */
    .timeline-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 24px; box-shadow: var(--shadow-sm); }
    .timeline-card h4 { color: var(--ll-navy); margin-bottom: 14px; }
    .timeline-card ul { list-style: none; margin: 0 0 20px; padding: 0; }
    .timeline-card li { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--divider); font-size: 14px; color: var(--fg2); }
    .timeline-card li:last-child { border-bottom: 0; }
    .timeline-card .date { font-family: var(--font-condensed); text-transform: uppercase; letter-spacing: 0.14em; font-size: 11px; color: var(--ll-orange); width: 60px; flex: none; padding-top: 2px; }
    .timeline-card .btn { width: 100%; margin-top: 8px; }

    /* Recipients */
    .recipients__grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .recipient-card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
    .recipient-card__thumb { width: 40px; height: 40px; background: var(--ll-cream); border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--ll-orange); margin-bottom: 10px; }
    .recipient-card__thumb svg { width: 20px; height: 20px; }
    .recipient-card__meta { font-family: var(--font-condensed); text-transform: uppercase; letter-spacing: 0.16em; font-size: 11px; color: var(--fg3); margin-bottom: 8px; }
    .recipient-card__quote { font-size: 14px; line-height: 1.5; color: var(--fg1); }

    /* Tournament */
    .tourney-hero img { width: 100%; max-height: 520px; object-fit: cover; object-position: center; border-radius: 14px; display: block; box-shadow: var(--shadow-photo); }
    .tourney-info__block { text-align: center; max-width: 720px; margin: 0 auto 32px; }
    .tourney-info__block .event-title { font-size: 52px; margin: 8px 0 16px; }
    .tourney-details { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .detail { display: flex; align-items: center; gap: 12px; padding: 18px; background: #fff; border: 1px solid var(--border); border-radius: 12px; }
    .detail svg { width: 26px; height: 26px; color: var(--ll-orange); flex: none; }
    .detail strong { display: block; font-size: 16px; color: var(--ll-navy); }
    .detail span { font-size: 13px; color: var(--fg3); }

    /* Register */
    .register { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; background: var(--ll-navy); color: #fff; border-radius: 14px; padding: 40px; align-items: center; }
    .register__copy h2 { color: #fff; }
    .register__copy p { color: rgba(255,255,255,0.8); }
    .register__form { display: flex; flex-direction: column; gap: 14px; }
    .register__form label { font-family: var(--font-condensed); text-transform: uppercase; letter-spacing: 0.14em; font-size: 11px; color: rgba(255,255,255,0.8); display: block; margin-bottom: 6px; }
    .register__form .field { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #fff; font-size: 15px; font-family: inherit; }
    .register__form .field::placeholder { color: rgba(255,255,255,0.45); }
    .register__form .field:focus { outline: none; border-color: var(--ll-orange); background: rgba(255,255,255,0.12); }
    .register__success { text-align: center; padding: 20px; }
    .register__success svg { width: 40px; height: 40px; color: var(--ll-orange); }
    .register__success h3 { color: #fff; margin: 10px 0; }
    .register__success p { color: rgba(255,255,255,0.8); }

    /* Gallery */
    .gallery__grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
    .gallery__grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; }

    /* Donate */
    .donate { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: start; }
    .donate__form { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 28px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 16px; }
    .donate__form label { font-family: var(--font-condensed); text-transform: uppercase; letter-spacing: 0.14em; font-size: 11px; color: var(--fg2); display: block; margin-bottom: 6px; }
    .donate__form .field { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border-strong); background: #fff; font-size: 15px; font-family: inherit; }
    .donate__form .field:focus { outline: none; border-color: var(--ll-navy); }
    .donate__tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .tier { padding: 14px; border-radius: 8px; border: 1.5px solid var(--border-strong); background: #fff; font-family: var(--font-body); font-weight: 700; font-size: 16px; color: var(--ll-navy); cursor: pointer; }
    .tier:hover { border-color: var(--ll-navy); }
    .tier.is-active { background: var(--ll-orange); border-color: var(--ll-orange); color: #fff; }
    .donate__legal { font-size: 12px; color: var(--fg3); text-align: center; }
    .donate-success { text-align: center; padding: 80px 20px; }
    .donate-success__icon { width: 48px; height: 48px; color: var(--ll-orange); margin-bottom: 16px; }

    /* Story */
    .story-hero { position: relative; border-radius: 14px; overflow: hidden; min-height: 340px; }
    .story-hero__img { width: 100%; height: 340px; object-fit: cover; display: block; filter: brightness(0.7); }
    .story-hero__overlay { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 36px; color: #fff; }
    .story-hero__overlay .eyebrow { color: var(--ll-orange); }
    .story-hero__overlay h1 { color: #fff; max-width: 700px; }
    .story-body { max-width: 680px; margin: 0 auto; }
    .story-body .lead { margin-bottom: 20px; }
    .story-body .lead em { color: var(--ll-orange); font-style: italic; font-weight: 600; }
    .story-cta { display: flex; gap: 12px; margin-top: 28px; }

    /* Footer */
    .site-footer { background: var(--ll-navy); color: rgba(255,255,255,0.75); padding: 48px 40px 28px; margin-top: 96px; }
    .site-footer__main { max-width: var(--container-xl); margin: 0 auto; display: grid; grid-template-columns: 1fr 2fr; gap: 48px; padding-bottom: 32px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .site-footer__brand { display: flex; gap: 14px; align-items: flex-start; }
    .site-footer__logo { width: 56px; filter: invert(1); opacity: 0.9; }
    .site-footer__tag em { display: block; font-weight: 600; font-style: italic; color: #fff; font-size: 18px; margin-bottom: 4px; }
    .site-footer__tag span { font-family: var(--font-condensed); text-transform: uppercase; letter-spacing: 0.2em; font-size: 11px; }
    .site-footer__cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .site-footer__cols h5 { font-family: var(--font-condensed); text-transform: uppercase; letter-spacing: 0.18em; font-size: 12px; color: #fff; margin: 0 0 12px; }
    .site-footer__cols a { display: block; color: rgba(255,255,255,0.7); text-decoration: none; font-size: 14px; padding: 4px 0; }
    .site-footer__cols a:hover { color: var(--ll-orange); }
    .site-footer__legal { max-width: var(--container-xl); margin: 0 auto; display: flex; justify-content: space-between; padding-top: 20px; font-size: 12px; color: rgba(255,255,255,0.5); }

    textarea { resize: vertical; }
    input, textarea, select { font-family: inherit; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  // Component: ZMark
  function ZMark({ size = 36 }) {
    return (
      <svg width={size} height={size} viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="14" y="14" width="72" height="13" rx="2" fill="#1a2a49" />
        <polygon points="72,27 86,27 28,73 14,73" fill="#1a2a49" />
        <rect x="14" y="73" width="72" height="13" rx="2" fill="#1a2a49" />
      </svg>
    );
  }

  // Component: SiteHeader
  function SiteHeader({ current = "home", onNav }) {
    const links = [
      { id: "home", label: "Home" },
      { id: "scholarship", label: "Scholarship" },
      { id: "tournament", label: "Golf Tournament" },
      { id: "story", label: "Zach's Story" },
      { id: "contact", label: "Contact" },
    ];
    return (
      <header className="site-header">
        <a className="brand" href="#" onClick={(e) => { e.preventDefault(); onNav && onNav("home"); }} style={{ gap: 14, alignItems: "center" }}>
          <ZMark size={38} />
          <div style={{ width: 1, height: 32, background: "rgba(26,42,73,0.15)" }} />
          <span style={{ display: "flex", flexDirection: "column", lineHeight: 1 }}>
            <span style={{ fontFamily: "Oswald, sans-serif", fontWeight: 700, fontSize: 17, textTransform: "uppercase", letterSpacing: "0.01em", color: "#1a2a49", lineHeight: 1 }}>Loving Life</span>
            <span style={{ fontFamily: "Oswald, sans-serif", fontWeight: 400, fontSize: 10, letterSpacing: "0.28em", textTransform: "uppercase", color: "#1a2a49", opacity: 0.55, marginTop: 6, lineHeight: 1 }}>Foundation</span>
          </span>
        </a>
        <nav className="site-nav">
          {links.map((l) => (
            <a key={l.id} href="#" className={"site-nav__link" + (current === l.id ? " is-active" : "")} onClick={(e) => { e.preventDefault(); onNav && onNav(l.id); }}>
              {l.label}
            </a>
          ))}
          <button className="btn btn--donate" onClick={() => onNav && onNav("donate")}>Donate</button>
        </nav>
      </header>
    );
  }

  // Component: SiteFooter
  function SiteFooter({ onNav }) {
    const nav = (id) => (e) => { e.preventDefault(); onNav && onNav(id); };
    return (
      <footer className="site-footer">
        <div className="site-footer__main">
          <div className="site-footer__brand">
            <div style={{ width: 56, height: 56, background: "rgba(255,255,255,0.1)", borderRadius: 6 }} />
            <div className="site-footer__tag">
              <em>"Life is what you make it."</em>
              <span>— Zach Matla</span>
            </div>
          </div>
          <div className="site-footer__cols">
            <div>
              <h5>Foundation</h5>
              <a href="#" onClick={nav("story")}>Our mission</a>
              <a href="#" onClick={nav("story")}>Board & family</a>
            </div>
            <div>
              <h5>Programs</h5>
              <a href="#" onClick={nav("scholarship")}>Memorial Scholarship</a>
              <a href="#" onClick={nav("tournament")}>Golf Tournament</a>
              <a href="#" onClick={nav("home")}>Community events</a>
            </div>
            <div>
              <h5>Get involved</h5>
              <a href="#" onClick={nav("donate")}>Donate</a>
              <a href="#" onClick={nav("tournament")}>Sponsor a hole</a>
            </div>
          </div>
        </div>
        <div className="site-footer__legal">
          <span>© 2026 The Loving Life Foundation of Zach Matla · Elma, NY</span>
          <span>501(c)(3) nonprofit</span>
        </div>
      </footer>
    );
  }

  // Component: HomeScreen
  function HomeScreen({ onNav }) {
    return (
      <div className="home">
        <section className="hero">
          <div className="hero__copy">
            <span className="eyebrow">A nonprofit in Elma, NY · est. 2018</span>
            <h1 className="hero__title">Honoring a life.<br />Carrying it forward.</h1>
            <p className="hero__lede">
              The Loving Life Foundation of Zach Matla keeps Zach's spirit close to the
              community he loved — through scholarships, a yearly tournament, and stories
              we refuse to let fade.
            </p>
            <div className="hero__ctas">
              <button className="btn btn--donate" onClick={() => onNav("donate")}>Donate</button>
              <button className="btn btn--ghost" onClick={() => onNav("story")}>Read Zach's story</button>
            </div>
          </div>
          <div className="hero__mark" aria-hidden="true" style={{ background: "rgba(26,42,73,0.08)", borderRadius: 12, padding: 40, display: "flex", alignItems: "center", justifyContent: "center" }}>
            <ZMark size={200} />
          </div>
        </section>

        <section className="stats">
          <div className="stat"><div className="stat__num">8</div><div className="stat__label">Years of giving</div></div>
          <div className="stat"><div className="stat__num">$142k</div><div className="stat__label">Raised for scholarships</div></div>
          <div className="stat"><div className="stat__num">27</div><div className="stat__label">Scholarships awarded</div></div>
          <div className="stat"><div className="stat__num">1</div><div className="stat__label">Tagline that started it all</div></div>
        </section>

        <section className="programs">
          <div className="section-head">
            <span className="eyebrow">What we do</span>
            <h2>Three ways we keep the light on.</h2>
          </div>
          <div className="programs__grid">
            <article className="program-card" onClick={() => onNav("scholarship")}>
              <div className="program-card__img" style={{ background: "linear-gradient(135deg, #5DD90A, #3E8E41)" }} />
              <div className="program-card__body">
                <span className="eyebrow">Scholarship</span>
                <h3>Zach Matla Memorial Scholarship</h3>
                <p>Awarded each spring to an Iroquois Central senior who embodies Zach's belief that kindness leaves a longer mark than anything.</p>
                <span className="link-arrow">Apply or nominate →</span>
              </div>
            </article>
            <article className="program-card" onClick={() => onNav("tournament")}>
              <div className="program-card__img" style={{ background: "linear-gradient(135deg, #2FA7E0, #1a2a49)" }} />
              <div className="program-card__body">
                <span className="eyebrow">Fundraiser</span>
                <h3>The Loving Life Golf Tournament</h3>
                <p>Our biggest day of the year. Grab your clubs, grab your friends, and do it for Zach.</p>
                <span className="link-arrow">Register a foursome →</span>
              </div>
            </article>
            <article className="program-card" onClick={() => onNav("story")}>
              <div className="program-card__img" style={{ background: "linear-gradient(135deg, #F26B1F, #E85D12)" }} />
              <div className="program-card__body">
                <span className="eyebrow">Community</span>
                <h3>Events & stories</h3>
                <p>From neon-green tutus on the green to quiet gatherings at the school — here's where we show up.</p>
                <span className="link-arrow">See what's next →</span>
              </div>
            </article>
          </div>
        </section>

        <section className="pullquote">
          <blockquote>"Life is what you make it."</blockquote>
          <div className="pullquote__attr">— Zach Matla</div>
        </section>
      </div>
    );
  }

  // Component: ScholarshipScreen
  function ScholarshipScreen({ onNav, dates = {} }) {
    const appsOpen = dates.appsOpen || "Mar 1";
    const appsClose = dates.appsClose || "Apr 15";
    const notified = dates.notified || "May 20";
    const presented = dates.presented || "Jun 6";
    const schYear = dates.schYear || "2026";
    return (
      <div className="page">
        <section className="page-hero">
          <div style={{ background: "linear-gradient(135deg, #5DD90A, #3E8E41)", borderRadius: 10 }} />
          <div className="page-hero__copy">
            <span className="eyebrow">Our signature program</span>
            <h1>The Zach Matla<br />Memorial Scholarship</h1>
            <p className="lead">Empowering future leaders — one Iroquois Central senior at a time.</p>
          </div>
        </section>

        <section className="two-col">
          <div>
            <h3>Who it's for</h3>
            <p>Graduating seniors at Iroquois Central High School in Elma, NY, who carry forward the spirit Zach brought to everything — warmth, curiosity, and the willingness to show up for the people around them.</p>
            <h3>How it's decided</h3>
            <p>A small committee made up of family, teachers, and past recipients reads every application. We're not looking for the top GPA — we're looking for the kid who'll keep the light on.</p>
          </div>
          <aside className="timeline-card">
            <h4>Key dates · {schYear}</h4>
            <ul>
              <li><span className="date">{appsOpen}</span> Applications open</li>
              <li><span className="date">{appsClose}</span> Applications close</li>
              <li><span className="date">{notified}</span> Recipients notified</li>
              <li><span className="date">{presented}</span> Presented at the golf tournament</li>
            </ul>
            <button className="btn btn--accent" onClick={() => onNav("apply")} style={{ width: "100%", marginTop: 8 }}>Apply now</button>
          </aside>
        </section>

        <section className="recipients">
          <div className="section-head">
            <span className="eyebrow">Past recipients</span>
            <h2>Kids Zach would have loved.</h2>
          </div>
          <div className="recipients__grid">
            {["2024 · Maya R.", "2023 · Daniel K.", "2022 · Alana P.", "2021 · Ben S."].map((r) => (
              <div key={r} className="recipient-card">
                <div className="recipient-card__thumb"><i data-lucide="graduation-cap"></i></div>
                <div className="recipient-card__meta">{r}</div>
                <div className="recipient-card__quote">"This scholarship let me say yes to college."</div>
              </div>
            ))}
          </div>
        </section>
      </div>
    );
  }

  // Component: TournamentScreen
  function TournamentScreen({ onNav, registered, onRegister, dates = {} }) {
    const [foursome, setFoursome] = React.useState("");
    const [email, setEmail] = React.useState("");

    const edition = dates.tourneyEdition || "8th Annual";
    const tourneyDate = dates.tourneyDate || "June 6, 2026";
    const tourneyDay = dates.tourneyDay || "Saturday, June 6, 2026";
    const tourneyTime = dates.tourneyTime || "9:00 am";

    return (
      <div className="page">
        <section className="tourney-hero">
          <div style={{ background: "linear-gradient(135deg, #2FA7E0, #1a2a49)", height: 300, borderRadius: 14 }} />
        </section>

        <section className="tourney-info">
          <div className="tourney-info__block">
            <span className="eyebrow">{edition}</span>
            <h1 className="event-title">The Loving Life Foundation<br />Golf Tournament</h1>
            <p className="lead">{tourneyDay} · Elma Meadows Golf Course · Shotgun start at {tourneyTime}</p>
          </div>

          <div className="tourney-details">
            <div className="detail"><i data-lucide="calendar"></i><div><strong>{tourneyDate}</strong><span>Shotgun · {tourneyTime}</span></div></div>
            <div className="detail"><i data-lucide="map-pin"></i><div><strong>Elma Meadows</strong><span>Elma, NY</span></div></div>
            <div className="detail"><i data-lucide="users"></i><div><strong>Foursomes</strong><span>$400 / team</span></div></div>
            <div className="detail"><i data-lucide="flag"></i><div><strong>Sponsor a hole</strong><span>From $150</span></div></div>
          </div>
        </section>

        <section className="register">
          <div className="register__copy">
            <h2>Register your foursome.</h2>
            <p>All proceeds go directly to the Zach Matla Memorial Scholarship. Neon tutus optional but enthusiastically encouraged.</p>
          </div>
          {registered ? (
            <div className="register__success">
              <i data-lucide="heart"></i>
              <h3>You're in.</h3>
              <p>We'll see you on the green, {foursome || "friend"}. Check <strong>{email || "your inbox"}</strong> for the details.</p>
            </div>
          ) : (
            <form className="register__form" onSubmit={(e) => { e.preventDefault(); onRegister(); }}>
              <div>
                <label>Foursome captain</label>
                <input className="field" value={foursome} onChange={(e) => setFoursome(e.target.value)} placeholder="Your name" required />
              </div>
              <div>
                <label>Email</label>
                <input className="field" type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="you@elma.org" required />
              </div>
              <button className="btn btn--donate" type="submit" style={{ width: "100%" }}>Register foursome</button>
            </form>
          )}
        </section>

        <section className="gallery">
          <span className="eyebrow">Last year, on the green</span>
          <div className="gallery__grid">
            {[1,2,3,4].map(i => <div key={i} style={{ background: "linear-gradient(135deg, #F26B1F, #E85D12)", borderRadius: 10, aspectRatio: "1" }} />)}
          </div>
        </section>
      </div>
    );
  }

  // Component: DonateScreen
  function DonateScreen({ onNav, onDonate, donated }) {
    const [amount, setAmount] = React.useState(100);
    const [custom, setCustom] = React.useState("");
    const [note, setNote] = React.useState("");
    const tiers = [25, 50, 100, 250, 500, 1000];

    if (donated) {
      return (
        <div className="page donate-success">
          <i data-lucide="heart" className="donate-success__icon"></i>
          <h1>Thank you.</h1>
          <p className="lead">Because of you, another student is one step closer to college.</p>
          <p>We'll send a receipt to your email. The Matla family sees every note.</p>
          <button className="btn btn--ghost" onClick={() => onNav("home")}>Back to home</button>
        </div>
      );
    }

    return (
      <div className="page donate">
        <div>
          <span className="eyebrow">Donate</span>
          <h1>Keep the light on.</h1>
          <p className="lead">100% of gifts support the Memorial Scholarship. The Loving Life Foundation is a registered 501(c)(3); your donation is tax-deductible.</p>
          <blockquote>"Every swing supports a kid headed to college."</blockquote>
        </div>

        <form className="donate__form" onSubmit={(e) => { e.preventDefault(); onDonate(); }}>
          <label>Choose an amount</label>
          <div className="donate__tiers">
            {tiers.map((t) => (
              <button type="button" key={t} className={"tier" + (amount === t && !custom ? " is-active" : "")} onClick={() => { setAmount(t); setCustom(""); }}>
                ${t}
              </button>
            ))}
          </div>
          <div>
            <label>Or a custom amount</label>
            <input className="field" inputMode="numeric" placeholder="$___" value={custom} onChange={(e) => setCustom(e.target.value.replace(/[^0-9]/g, ""))} />
          </div>
          <div>
            <label>A note for the family <span style={{ opacity: 0.6 }}>(optional)</span></label>
            <textarea className="field" rows="3" value={note} onChange={(e) => setNote(e.target.value)} placeholder="Zach taught me..."></textarea>
          </div>
          <button className="btn btn--donate" type="submit" style={{ width: "100%" }}>Donate ${custom || amount}</button>
          <div className="donate__legal">Illustrative form — no live payment processing in this kit</div>
        </form>
      </div>
    );
  }

  // Component: StoryScreen
  function StoryScreen({ onNav }) {
    return (
      <div className="page story">
        <section className="story-hero">
          <div style={{ background: "linear-gradient(135deg, #F26B1F, #E85D12)", height: 300, borderRadius: 14 }} />
          <div className="story-hero__overlay">
            <span className="eyebrow" style={{ fontSize: 16, letterSpacing: "0.2em", color: "#fff", opacity: 1 }}>Zach's story</span>
            <h1>The tagline that started a foundation.</h1>
          </div>
        </section>

        <article className="story-body">
          <p className="lead">Zach Matla believed, out loud and often, that <em>life is what you make it</em>. He lived like it. And when he was gone, the people who loved him kept saying it to each other — until saying it wasn't enough, and we started doing something with it.</p>
          <p>Zach grew up in Elma and moved through the halls of Iroquois Central like a kid who actually meant the things he said. He had a gift for making people feel seen. He showed up. He stayed a little longer than he had to.</p>
          <p>The Loving Life Foundation was founded by his family and closest friends in 2018. Since then we've awarded 27 scholarships, hosted eight golf tournaments, and kept telling his story to anyone who'll listen.</p>
          <blockquote>"He made you feel like you were the most important person in the room. Every room. Every time."</blockquote>
          <p style={{ marginBottom: 20 }}><strong>— Carla Matla, Zach's mother</strong></p>
          <h3>What comes next</h3>
          <p>We're not going anywhere. As long as there's a senior at Iroquois Central who needs a hand, a friend who wants to swing a club for a good reason, or a stranger who needs to hear a sentence that might change the shape of their day — we'll be here.</p>
          <div className="story-cta">
            <button className="btn btn--donate" onClick={() => onNav("donate")}>Donate in Zach's name</button>
            <button className="btn btn--ghost" onClick={() => onNav("tournament")}>Join us on the green</button>
          </div>
        </article>
      </div>
    );
  }

  // Main App
  function App() {
    const DATES = { tourneyEdition: "8th Annual", tourneyDay: "Saturday, June 6, 2026", tourneyDate: "June 6, 2026", tourneyTime: "9:00 am", appsOpen: "Mar 1", appsClose: "Apr 15", notified: "May 20", presented: "Jun 6", schYear: "2026" };

    const [screen, setScreen] = React.useState("home");
    const [registered, setRegistered] = React.useState(false);
    const [donated, setDonated] = React.useState(false);
    React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

    const onNav = (id) => {
      if (id === "apply") return setScreen("scholarship");
      setScreen(id);
      window.scrollTo({ top: 0, behavior: "instant" });
      if (id !== "tournament") setRegistered(false);
      if (id !== "donate") setDonated(false);
    };

    return (
      <div className="app">
        <SiteHeader current={screen} onNav={onNav} />
        <main>
          {screen === "home" && <HomeScreen onNav={onNav} />}
          {screen === "scholarship" && <ScholarshipScreen onNav={onNav} dates={DATES} />}
          {screen === "tournament" && <TournamentScreen onNav={onNav} registered={registered} onRegister={() => setRegistered(true)} dates={DATES} />}
          {screen === "story" && <StoryScreen onNav={onNav} />}
          {screen === "donate" && <DonateScreen onNav={onNav} onDonate={() => setDonated(true)} donated={donated} />}
          {screen === "contact" && (
            <div className="page">
              <div style={{ textAlign: "center", padding: "80px 20px" }}>
                <span className="eyebrow">Contact</span>
                <h1>Say hello.</h1>
                <p className="lead">hello@lovinglife-zachmatla.org · Elma, NY</p>
              </div>
            </div>
          )}
        </main>
        <SiteFooter onNav={onNav} />
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
