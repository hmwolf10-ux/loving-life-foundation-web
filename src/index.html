<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Loving Life Foundation — Website UI Kit</title>
<link rel="stylesheet" href="styles/kit.css">
<link rel="stylesheet" href="styles/styles.css">
<link rel="stylesheet" href="styles/elements.css">
<link rel="stylesheet" href="../design-system/tokens/colors.css">
<link rel="stylesheet" href="../design-system/tokens/typography.css">
<link rel="stylesheet" href="../design-system/tokens/spacing.css">
<link rel="stylesheet" href="../design-system/tokens/effects.css">
<link rel="stylesheet" href="../design-system/tokens/layout.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="components/SiteHeader.jsx"></script>
<script type="text/babel" src="components/SiteFooter.jsx"></script>
<script type="text/babel" src="pages/HomeScreen.jsx"></script>
<script type="text/babel" src="pages/ScholarshipScreen.jsx"></script>
<script type="text/babel" src="pages/TournamentScreen.jsx"></script>
<script type="text/babel" src="pages/DonateScreen.jsx"></script>
<script type="text/babel" src="pages/StoryScreen.jsx"></script>
<script type="text/babel">
const DATES = { tourneyEdition: "6th Annual", tourneyDay: "Saturday, August 1, 2026", tourneyDate: "August 1, 2026", tourneyTime: "10:00 am", appsOpen: "Mar 1", appsClose: "Apr 15", notified: "May 20", presented: "Jun 6", schYear: "2026" };

function App() {
  const [screen, setScreen] = React.useState(() => localStorage.getItem("llf_screen") || "home");
  const [registered, setRegistered] = React.useState(false);
  const [donated, setDonated] = React.useState(false);

  React.useEffect(() => { localStorage.setItem("llf_screen", screen); }, [screen]);
  React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

  const onNav = (id) => {
    if (id === "apply") return setScreen("scholarship");
    setScreen(id);
    window.scrollTo({ top: 0, behavior: "instant" });
    if (id !== "tournament") setRegistered(false);
    if (id !== "donate") setDonated(false);
  };

  return (
    <div className="app">
      <SiteHeader current={screen} onNav={onNav} />
      <main>
        {screen === "home" && <HomeScreen onNav={onNav} />}
        {screen === "scholarship" && <ScholarshipScreen onNav={onNav} dates={DATES} />}
        {screen === "tournament" && <TournamentScreen onNav={onNav} registered={registered} onRegister={() => setRegistered(true)} dates={DATES} />}
        {screen === "story" && <StoryScreen onNav={onNav} />}
        {screen === "donate" && <DonateScreen onNav={onNav} onDonate={() => setDonated(true)} donated={donated} />}
        {screen === "contact" && (
          <div className="page">
            <div style={{ textAlign: "center", padding: "80px 20px" }}>
              <span className="eyebrow">Contact</span>
              <h1>Say hello.</h1>
              <p className="lead">hello@lovinglife-zachmatla.org · Elma, NY</p>
            </div>
          </div>
        )}
      </main>
      <SiteFooter onNav={onNav} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
