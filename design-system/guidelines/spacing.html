<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="8px base grid, --sp-1 through --sp-10" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg);font-family:var(--font-body)}
.row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.bar{background:var(--ll-orange);height:14px;border-radius:3px}
.lbl{font-family:var(--font-mono);font-size:11px;color:var(--fg3);width:110px}
</style></head><body>
<div class="row"><span class="lbl">--sp-2 · 8px</span><div class="bar" style="width:8px"></div></div>
<div class="row"><span class="lbl">--sp-3 · 12px</span><div class="bar" style="width:12px"></div></div>
<div class="row"><span class="lbl">--sp-4 · 16px</span><div class="bar" style="width:16px"></div></div>
<div class="row"><span class="lbl">--sp-5 · 24px</span><div class="bar" style="width:24px"></div></div>
<div class="row"><span class="lbl">--sp-6 · 32px</span><div class="bar" style="width:32px"></div></div>
<div class="row"><span class="lbl">--sp-7 · 48px</span><div class="bar" style="width:48px"></div></div>
<div class="row"><span class="lbl">--sp-8 · 64px</span><div class="bar" style="width:64px"></div></div>
</body></html>
