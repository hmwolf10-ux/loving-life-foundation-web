<!-- @dsCard group="Brand" viewport="700x160" name="Iconography" subtitle="Flagged substitution — Lucide stands in; no native icon system" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>body{margin:0;padding:24px 28px;background:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:16px}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px}
.cell svg{color:var(--ll-navy);width:24px;height:24px;stroke-width:1.75}
.n{font-family:var(--font-mono);font-size:10px;color:var(--fg3)}
.flag{font-family:var(--font-mono);font-size:10px;color:var(--ll-orange);margin-top:14px}
</style></head><body>
<div class="grid">
<div class="cell"><i data-lucide="heart"></i><span class="n">heart</span></div>
<div class="cell"><i data-lucide="graduation-cap"></i><span class="n">grad-cap</span></div>
<div class="cell"><i data-lucide="flag"></i><span class="n">flag</span></div>
<div class="cell"><i data-lucide="calendar"></i><span class="n">calendar</span></div>
<div class="cell"><i data-lucide="users"></i><span class="n">users</span></div>
<div class="cell"><i data-lucide="mail"></i><span class="n">mail</span></div>
<div class="cell"><i data-lucide="map-pin"></i><span class="n">map-pin</span></div>
<div class="cell"><i data-lucide="arrow-right"></i><span class="n">arrow</span></div>
</div>
<div class="flag">⚑ Substitution: Lucide stands in — the foundation has no native icon system.</div>
<script>lucide.createIcons();</script>
</body></html>
