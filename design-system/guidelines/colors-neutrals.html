<!-- @dsCard group="Colors" viewport="700x180" name="Neutrals" subtitle="Warm paper/stone scale — never stark white or cool gray" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg);font-family:var(--font-body)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sw{border-radius:8px;padding:8px;height:70px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--border)}
.name{font-family:var(--font-condensed);text-transform:uppercase;letter-spacing:.1em;font-size:9px;font-weight:600;color:#3E3A30}
.hex{font-family:var(--font-mono);font-size:9px;color:#7A7566}
</style></head><body>
<div class="grid">
<div class="sw" style="background:#FBF8F1"><span class="name">Paper</span><span class="hex">#FBF8F1</span></div>
<div class="sw" style="background:#F7F2E8"><span class="name">Cream</span><span class="hex">#F7F2E8</span></div>
<div class="sw" style="background:#EFE7D4"><span class="name">Sand</span><span class="hex">#EFE7D4</span></div>
<div class="sw" style="background:#EBE8E1"><span class="name">Stone 100</span><span class="hex">#EBE8E1</span></div>
<div class="sw" style="background:#D8D3C7"><span class="name">Stone 200</span><span class="hex">#D8D3C7</span></div>
<div class="sw" style="background:#B8B1A1"><span class="name">Stone 300</span><span class="hex">#B8B1A1</span></div>
</div>
</body></html>
