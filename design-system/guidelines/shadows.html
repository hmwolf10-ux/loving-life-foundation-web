<!-- @dsCard group="Foundations" viewport="700x180" name="Shadows" subtitle="Warm navy-tinted — like a printed photo resting on paper" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:28px;background:var(--ll-cream);font-family:var(--font-body)}
.row{display:flex;gap:24px}
.box{width:100px;height:80px;background:#fff;border-radius:10px}
.lbl{font-family:var(--font-mono);font-size:10px;color:var(--fg3);text-align:center;margin-top:10px}
.col{display:flex;flex-direction:column;align-items:center}
</style></head><body>
<div class="row">
<div class="col"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="lbl">--shadow-sm</div></div>
<div class="col"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="lbl">--shadow-md</div></div>
<div class="col"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="lbl">--shadow-lg</div></div>
<div class="col"><div class="box" style="box-shadow:var(--shadow-photo)"></div><div class="lbl">--shadow-photo</div></div>
</div>
</body></html>
