<!-- @dsCard group="Brand" viewport="700x340" name="Logo colorways" subtitle="The Z mark — 'Life is what you make it' ring" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:0;background:var(--bg)}
.wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:0;height:340px}
.tile{display:flex;align-items:center;justify-content:center;padding:20px;position:relative;background:#FBF8F1;border-right:1px solid var(--divider);border-bottom:1px solid var(--divider)}
.tile img{max-width:82%;max-height:82%;object-fit:contain}
.lbl{position:absolute;bottom:10px;left:14px;font-family:var(--font-condensed);text-transform:uppercase;letter-spacing:.16em;font-size:10px;color:rgba(0,0,0,.55)}
.on-navy{background:#1A2A49}.on-navy .lbl{color:rgba(255,255,255,.85)}.on-navy img{filter:invert(1)}
</style></head><body>
<div class="wrap">
<div class="tile"><img src="../assets/logos/black-white.png" alt="Black on white"><span class="lbl">Black · original</span></div>
<div class="tile on-navy"><img src="../assets/logos/black-white.png" alt="White reversed"><span class="lbl">White reversed</span></div>
<div class="tile"><img src="../assets/logos/navy.png" alt="Navy colorway"><span class="lbl">Navy</span></div>
<div class="tile"><img src="../assets/logos/orange.png" alt="Orange colorway"><span class="lbl">Orange</span></div>
<div class="tile"><img src="../assets/logos/green.png" alt="Green colorway"><span class="lbl">Green</span></div>
<div class="tile"><img src="../assets/logos/green-orange-green.png" alt="Green/orange ring"><span class="lbl">Green · orange ring</span></div>
<div class="tile"><img src="../assets/logos/sky.png" alt="Sky colorway"><span class="lbl">Sky</span></div>
<div class="tile"><img src="../assets/logos/navy-orange.png" alt="Navy/orange"><span class="lbl">Navy · orange ring</span></div>
</div>
</body></html>
