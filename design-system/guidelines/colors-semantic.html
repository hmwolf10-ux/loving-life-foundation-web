<!-- @dsCard group="Colors" viewport="700x140" name="Semantic" subtitle="Success / info / warn / danger mapped to brand hues" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg);font-family:var(--font-body)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sw{border-radius:8px;padding:10px;height:70px;display:flex;flex-direction:column;justify-content:space-between;color:#fff}
.name{font-family:var(--font-condensed);text-transform:uppercase;letter-spacing:.12em;font-size:10px;font-weight:700}
.hex{font-family:var(--font-mono);font-size:10px;opacity:.9}
</style></head><body>
<div class="grid">
<div class="sw" style="background:#3E8E41"><span class="name">Success</span><span class="hex">#3E8E41</span></div>
<div class="sw" style="background:#2FA7E0"><span class="name">Info</span><span class="hex">#2FA7E0</span></div>
<div class="sw" style="background:#F26B1F"><span class="name">Warn</span><span class="hex">#F26B1F</span></div>
<div class="sw" style="background:#B4321E"><span class="name">Danger</span><span class="hex">#B4321E</span></div>
</div>
</body></html>
