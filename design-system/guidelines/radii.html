<!-- @dsCard group="Foundations" viewport="700x160" name="Corner radii" subtitle="Mid-round everything — never square, never highly rounded" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg);font-family:var(--font-body)}
.row{display:flex;gap:16px;align-items:center}
.box{width:70px;height:70px;background:#fff;border:1px solid var(--border)}
.lbl{font-family:var(--font-mono);font-size:10px;color:var(--fg3);text-align:center;margin-top:6px}
.col{display:flex;flex-direction:column;align-items:center}
</style></head><body>
<div class="row">
<div class="col"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="lbl">sm · 4px</div></div>
<div class="col"><div class="box" style="border-radius:var(--radius-md)"></div><div class="lbl">md · 8px<br>buttons</div></div>
<div class="col"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="lbl">lg · 14px<br>cards</div></div>
<div class="col"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="lbl">xl · 22px</div></div>
<div class="col"><div class="box" style="border-radius:var(--radius-pill);width:100px"></div><div class="lbl">pill<br>tags/badges</div></div>
</div>
</body></html>
